<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunuAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="menu-btn" onclick="toggleMenu()">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>

    <div id="sideMenu" class="side-menu">
        <button onclick="closeMenu()">X</button>
        <h3 data-i18n="title">SunuAI</h3>
        <a href="#" onclick="resetHome(); closeMenu()" data-i18n="newChat">Nouvelle génération</a>
        <a href="#" onclick="showAbout(); closeMenu()" data-i18n="about">À propos</a>
        <a href="#" onclick="showPrivacy(); closeMenu()" data-i18n="privacy">Politique de confidentialité</a>

        <div class="settings-item">
            <span data-i18n="darkMode">Mode sombre</span>
            <label class="switch">
                <input type="checkbox" id="darkModeToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="settings-item">
            <span data-i18n="language">Langue</span>
            <select id="langSelect">
                <option value="fr">Français</option>
                <option value="en">English</option>
                <option value="wo">Wolof</option>
            </select>
        </div>
    </div>
    <div id="overlay" class="overlay" onclick="closeMenu()"></div>

    <div class="main">
        <div class="container">
            <h1 data-i18n="appTitle">Générateur</h1>

            <div class="controls">
                <input type="text" id="prompt" data-i18n-placeholder="prompt">

                <div class="options">
                    <select id="mode">
                        <option value="image" data-i18n="modeImage">Image</option>
                        <option value="video" data-i18n="modeVideo">Vidéo</option>
                        <option value="text">Texte</option>
                    </select>

                    <select id="style">
                        <option value="photorealistic" data-i18n="realistic">Réaliste</option>
                        <option value="anime style" data-i18n="anime">Anime</option>
                        <option value="oil painting" data-i18n="painting">Peinture</option>
                        <option value="3d render" data-i18n="render3d">3D</option>
                    </select>
                    <select id="format">
                        <option value="1024x1024">Carré 1:1</option>
                        <option value="1024x1536">Portrait 2:3</option>
                        <option value="1536x1024">Paysage 3:2</option>
                    </select>
                    <select id="resolution">
                        <option value="" data-i18n="stdRes">Résolution standard</option>
                        <option value="high detail" data-i18n="hdRes">Haute résolution</option>
                    </select>
                    <input type="text" id="negatif" class="negatif" data-i18n-placeholder="negative">
                </div>

                <div class="buttons">
                    <button onclick="generer()" data-i18n="generate">Générer</button>
                    <button class="secondary" onclick="telecharger()" data-i18n="download">Télécharger</button>
                </div>
            </div>

            <div class="result-zone">
                <div id="result"><p style="color:#9CA3AF" data-i18n="resultHere">Le résultat apparaîtra ici</p></div>
            </div>
        </div>
    </div>

<script>
let lastImageUrl = "";
let lastMode = "image";

const translations = {
    fr: {title: "SunuAI", newChat: "Nouvelle génération", about: "À propos", privacy: "Politique de confidentialité", darkMode: "Mode sombre", language: "Langue", appTitle: "Générateur", prompt: "Décris l'image, vidéo ou pose une question...", negative: "À exclure: texte, flou, basse qualité", realistic: "Réaliste", anime: "Anime", painting: "Peinture", render3d: "3D", stdRes: "Résolution standard", hdRes: "Haute résolution", generate: "Générer", download: "Télécharger", resultHere: "Le résultat apparaîtra ici", generating: "Génération en cours... 30-60s pour la vidéo", emptyAlert: "Écris une description d'abord", modeImage: "Image", modeVideo: "Vidéo", aboutText: `<h2>À propos de SunuAI</h2><p>Bienvenue sur SunuAI.</p>`, privacyText: `<h2>Politique de confidentialité</h2><p>Contact: faluzodiop@gmail.com</p>`},
    en: {title: "SunuAI", newChat: "New generation", about: "About", privacy: "Privacy Policy", darkMode: "Dark mode", language: "Language", appTitle: "Generator", prompt: "Describe the image, video or ask a question...", negative: "Exclude: text, blur, low quality", realistic: "Realistic", anime: "Anime", painting: "Painting", render3d: "3D", stdRes: "Standard resolution", hdRes: "High resolution", generate: "Generate", download: "Download", resultHere: "Result will appear here", generating: "Generating... 30-60s for video", emptyAlert: "Write a description first", modeImage: "Image", modeVideo: "Video", aboutText: `<h2>About SunuAI</h2><p>Welcome to SunuAI.</p>`, privacyText: `<h2>Privacy Policy</h2><p>Contact: faluzodiop@gmail.com</p>`},
    wo: {title: "SunuAI", newChat: "Dañu sosal bu bees", about: "Ci SunuAI", privacy: "Politique de confidentialité", darkMode: "Lëndëm", language: "Làkk", appTitle: "Soskat", prompt: "Waxal nataal, vidéo wala laaj...", negative: "Wara baña: bind, xel, qualité bu bon", realistic: "Ku nekk", anime: "Anime", painting: "Lekkal", render3d: "3D", stdRes: "Qualité bi", hdRes: "Qualité kawe", generate: "Sossal", download: "Jox", resultHere: "Résultat bi dina feeñ fii", generating: "Dinañu ko defar... 30-60s", emptyAlert: "Binde bu baax bi", modeImage: "Nataal", modeVideo: "Vidéo", aboutText: `<h2>Ci SunuAI</h2><p>Application bu sossal nataal ak vidéo.</p>`, privacyText: `<h2>Politique de confidentialité</h2><p>Contact: faluzodiop@gmail.com</p>`}
};

function setLanguage(lang){ document.documentElement.lang = lang; localStorage.setItem('lang', lang); document.querySelectorAll('[data-i18n]').forEach(el => { if(translations[lang][el.dataset.i18n]) el.textContent = translations[lang][el.dataset.i18n]; }); document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { if(translations[lang][el.dataset.i18nPlaceholder]) el.placeholder = translations[lang][el.dataset.i18nPlaceholder]; }); }
function toggleMenu(){ document.getElementById('sideMenu').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
function closeMenu(){ document.getElementById('sideMenu').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
function resetHome(){ let lang = localStorage.getItem('lang') || 'fr'; document.getElementById('result').innerHTML = `<p style="color:var(--text-secondary)" data-i18n="resultHere">${translations[lang].resultHere}</p>`; document.getElementById('prompt').value = ""; }
function showAbout(){ let lang = localStorage.getItem('lang') || 'fr'; document.getElementById('result').innerHTML = `<div class="page-content">${translations[lang].aboutText}</div>`; }
function showPrivacy(){ let lang = localStorage.getItem('lang') || 'fr'; document.getElementById('result').innerHTML = `<div class="page-content">${translations[lang].privacyText}</div>`; }

const darkToggle = document.getElementById('darkModeToggle');
if(localStorage.getItem('theme') === 'dark'){ document.body.classList.add('dark'); darkToggle.checked = true; }
darkToggle.addEventListener('change', () => { document.body.classList.toggle('dark'); localStorage.setItem('theme', document.body.classList.contains('dark')? 'dark' : 'light'); });

const langSelect = document.getElementById('langSelect');
const savedLang = localStorage.getItem('lang') || 'fr';
langSelect.value = savedLang;
setLanguage(savedLang);
langSelect.addEventListener('change', (e) => setLanguage(e.target.value));

// FONCTION PRINCIPALE CORRIGEE POUR GITHUB PAGES
async function generer() {
    let lang = localStorage.getItem('lang') || 'fr';
    let prompt = document.getElementById("prompt").value;
    let mode = document.getElementById("mode").value;
    let style = document.getElementById("style").value;
    let format = document.getElementById("format").value;
    let resolution = document.getElementById("resolution").value;
    let negatif = document.getElementById("negatif").value;
    let result = document.getElementById("result");

    if(prompt == "") { alert(translations[lang].emptyAlert); return; }

    lastMode = mode;
    result.innerHTML = `<div class="loader"></div><p>${translations[lang].generating}</p>`;

    if(mode === "text"){
        await genererTexte(prompt, result, lang); // CORRIGE ICI
        return;
    }

    let fullPrompt = `${prompt}, ${style}, ${resolution}, no ${negatif}`;

    if(mode === "video"){
        let videoUrl = `https://api.pollinations.ai/video/${encodeURIComponent(fullPrompt)}`;
        lastImageUrl = videoUrl;
        result.innerHTML = `<video src="${videoUrl}" controls autoplay loop playsinline style="max-width:100%; border-radius:8px;"></video>`;
    } else {
        let [w,h] = format.split('x');
        let mediaUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=${w}&height=${h}&model=flux&nologo=true`;
        lastImageUrl = mediaUrl;
        let img = new Image();
        img.src = mediaUrl;
        img.onload = () => { result.innerHTML = `<img src="${mediaUrl}" style="max-width:100%; border-radius:8px;">`; }
        img.onerror = () => { result.innerHTML = `<p style="color:red">Erreur. Réessaie.</p>`; }
    }
}

// FONCTION TEXTE CORRIGEE POUR GITHUB PAGES - 100% GRATUIT
async function genererTexte(prompt, result, lang) {
    try {
        const response = await fetch('https://text.pollinations.ai/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                messages: [{ role: "user", content: prompt }],
                model: "openai-large" // gratuit illimité
            })
        })

        const data = await response.json()

        if(!data.choices) {
            result.innerHTML = `<p style="color:red">Erreur API: ${JSON.stringify(data)}</p>`;
            return;
        }

        result.innerHTML = `<div class="page-content"><p>${data.choices[0].message.content}</p></div>`;

    } catch(e) {
        result.innerHTML = `<p style="color:red">Erreur: ${e.message}</p>`;
    }
}

function telecharger() {
    if(!lastImageUrl) return;
    let a = document.createElement('a');
    a.href = lastImageUrl;
    a.download = lastMode === "video"? 'sunuai-video.mp4' : 'sunuai-image.png';
    a.click();
}

document.getElementById('prompt').addEventListener("keypress", function(e) { if (e.key === "Enter") generer(); });
</script>
</body>
            </html>
