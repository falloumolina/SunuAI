<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunuAI 🇸🇳</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; 
            padding: 20px; 
            background: linear-gradient(135deg, #E6F3FF 0%, #F0F8FF 100%); 
            text-align: center; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 154, 73, 0.12);
        }
        h1 { 
            color: #009A49; /* Vert Sénégal */
            font-size: 36px;
            margin: 0 0 8px 0;
            font-weight: 800;
        }
        p {
            color: #6B7280;
            margin-bottom: 25px;
            font-size: 16px;
        }
        input { 
            padding: 14px; 
            width: 100%; 
            margin: 10px 0; 
            border-radius: 12px; 
            border: 2px solid #E5E7EB; 
            font-size: 16px; 
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #009A49;
            box-shadow: 0 0 0 3px rgba(0, 154, 73, 0.1);
        }
        button { 
            background: #009A49; 
            color: white; 
            font-weight: bold; 
            border: none;
            padding: 15px; 
            width: 100%; 
            margin: 15px 0; 
            border-radius: 12px; 
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { 
            background: #007a3a;
            transform: translateY(-2px);
        }
        #result img { 
            max-width: 100%; 
            border-radius: 16px; 
            margin-top: 20px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            border: 3px solid white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇸🇳 SunuAI</h1>
        <p>Générateur d'images Gratuit et Rapide</p>
        
        <input type="text" id="prompt" placeholder="Ex: Un lion sous un baobab">
        <br>
        <button onclick="generer()">Générer</button>
        
        <div id="result"></div>
    </div>

<script>
function generer() {
    let prompt = document.getElementById("prompt").value;
    let result = document.getElementById("result");
    
    if(prompt == "") { alert("Écris quelque chose d'abord !"); return; }
    
    result.innerHTML = "<p>⏳ Génération en cours... 5-10s</p>";
    
    // LIEN MAGIQUE QUI MARCHE TOUJOURS
    let imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt + ", photorealistic, high quality")}`;
    
    result.innerHTML = `<img src="${imgUrl}" onload="this.nextElementSibling.innerText='Voici ton image pour: ${prompt}'">
                        <p>⏳ Génération en cours...</p>`;
}
</script>
</body>
    </html>
