<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunuAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <button class="menu-btn">☰</button>
        <button class="refresh-btn">⟳</button>
    </div>

    <div class="chat-area">
        <div id="result">
            <div class="empty-state">
                <h1>SunuAI</h1>
                <p>Que veux-tu créer aujourd'hui?</p>
            </div>
        </div>
    </div>

    <div class="suggestions">
        <button onclick="setPrompt('Créer une image')"><span>🖼️</span> Créer une image</button>
        <button onclick="setPrompt('Écrire ou modifier')"><span>✏️</span> Écrire ou modifier</button>
    </div>

    <div class="input-bar">
        <button class="plus-btn">+</button>
        <input type="file" id="imageUpload" accept="image/*" style="display:none">
        <input type="text" id="prompt" placeholder="Demander à SunuAI">
        <button class="mic-btn">🎤</button>
        <button class="send-btn" onclick="generer()">➤</button>
    </div>

<script>
let lastImageUrl = "";
let uploadedImage = null;

document.querySelector('.plus-btn').onclick = () => document.getElementById('imageUpload').click();

document.getElementById('imageUpload').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(event){
            uploadedImage = event.target.result;
            document.getElementById('prompt').placeholder = "Image ajoutée. Décris la modification...";
        }
        reader.readAsDataURL(file);
    }
});

function setPrompt(text){
    document.getElementById('prompt').value = text + ": ";
    document.getElementById('prompt').focus();
}

function generer() {
    let prompt = document.getElementById("prompt").value;
    let result = document.getElementById("result");

    if(prompt == "") { return; }

    result.innerHTML = `<div class="loader"></div><p>Génération en cours...</p>`;

    let fullPrompt = prompt + ", photorealistic, high quality";
    let imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=1024&height=1024`;
    lastImageUrl = imgUrl;

    let img = new Image();
    img.src = imgUrl;
    img.onload = () => {
        result.innerHTML = `<img src="${imgUrl}">`;
    }
}

document.getElementById('prompt').addEventListener("keypress", function(e) {
    if (e.key === "Enter") generer();
});
</script>
</body>
            </html>
